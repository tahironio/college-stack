# Общий стек колледжа.
# Для Ubuntu расположите этот каталог рядом с ais-college, distantes и schedule-app,
# скопируйте .env.example в .env и заполните секреты.

services:
  # -------------------- Внешняя точка входа --------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-college.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - ais_static:/var/www/ais-static:ro
      - ais_media:/var/www/ais-media:ro
    depends_on:
      - ais
      - distantes
      - schedule-frontend
    networks: [college]
    command: >-
      /bin/sh -c
      "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  # -------------------- AIS / Django --------------------
  ais:
    build:
      context: ${AIS_PATH:-../AIS/ais-college}
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${AIS_SECRET_KEY:?Заполните AIS_SECRET_KEY в .env}
      DJANGO_ALLOWED_HOSTS: ${AIS_ALLOWED_HOSTS:-ais.college.local,localhost,127.0.0.1}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DPO_API_TOKEN: ${DPO_API_TOKEN:-change-me}
      GUNICORN_WORKERS: ${AIS_GUNICORN_WORKERS:-2}
    volumes:
      - ais_db:/app/data
      - ais_media:/app/media
      - ais_static:/app/staticfiles
    expose:
      - "8000"
    networks: [college]

  # -------------------- Distantes / Next.js --------------------
  distantes:
    build:
      context: ${DISTANTES_PATH:-../distantes}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${DISTANTES_SESSION_SECRET:?Заполните DISTANTES_SESSION_SECRET в .env}
      DATABASE_PATH: /app/data/lampa.sqlite
      JITSI_URL: ${JITSI_URL:-https://meet.jit.si}
    volumes:
      - distantes_db:/app/data
    expose:
      - "3000"
    networks: [college]

  # -------------------- Shedule --------------------
  schedule-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schedule_db}
      POSTGRES_USER: ${POSTGRES_USER:-schedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в .env}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - schedule_pgdata:/var/lib/postgresql/data
      - ${SCHEDULE_PATH:-../Shedule}/backend/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schedule} -d ${POSTGRES_DB:-schedule_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [college]

  schedule-backend:
    build:
      context: ${SCHEDULE_PATH:-../Shedule}/backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: schedule-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-schedule_db}
      DB_USER: ${POSTGRES_USER:-schedule}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в .env}
      JWT_SECRET: ${JWT_SECRET:?Заполните JWT_SECRET в .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      schedule-postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      college:
        aliases: [backend]

  schedule-frontend:
    build:
      context: ${SCHEDULE_PATH:-../Shedule}/frontend
    restart: unless-stopped
    depends_on:
      - schedule-backend
    expose:
      - "80"
    networks: [college]

  schedule-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: schedule-postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-schedule}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Заполните POSTGRES_PASSWORD в .env}
      PGDATABASE: ${POSTGRES_DB:-schedule_db}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./backups:/backups
      - ${SCHEDULE_PATH:-../Shedule}/deploy/backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      schedule-postgres:
        condition: service_healthy
    networks: [college]

volumes:
  ais_db:
  ais_media:
  ais_static:
  distantes_db:
  schedule_pgdata:

networks:
  college:
